<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LazyPO · voix</title>
<style>
  :root { color-scheme: dark; --bg:#0f1218; --card:#171c25; --line:#273040; --text:#e6e9ef; --muted:#8b95a7; --accent:#7cc4ff; --ok:#4ade80; --warn:#f59e0b; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); margin-right:6px; }
  .pill.ok { color: var(--ok); border-color: rgba(74,222,128,.4); }
  .pill.bad { color: var(--bad); border-color: rgba(248,113,113,.4); }
  section { margin-top: 24px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .full { grid-column: 1 / -1; }
  label { display:block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  input { width: 100%; background: #0c0f14; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display:flex; gap: 8px; justify-content: flex-end; margin-top: 12px; align-items: center; }
  .when { color: var(--muted); font-size: 12px; margin-right: auto; }
  button { font: inherit; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--line); background: #1f2735; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #06111c; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); }
  .msg { font-size: 13px; margin-top: 8px; min-height: 1em; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  code { background: #0c0f14; padding: 1px 6px; border-radius: 6px; font-size: 13px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>LazyPO · voix</h1>
  <p class="sub" id="status">…</p>

  <section>
    <h2>Mots dictés à valider</h2>
    <div id="drafts"><p class="empty">Chargement…</p></div>
  </section>

  <section>
    <h2>Serveur</h2>
    <div class="card" id="server">…</div>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (iso) { try { return new Date(iso).toLocaleString('fr-BE', { timeZone: 'Europe/Brussels', dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; } };
  var busy = false;

  function render(state) {
    var s = state.session;
    $('status').innerHTML = (s
      ? '<span class="pill ok">connecté · ' + esc(s.email) + '</span>'
      : '<span class="pill bad">pas de session</span> lance <code>node mcp/login.mjs</code> dans le dossier LazyPO') +
      '<span class="pill">' + state.drafts.length + ' brouillon' + (state.drafts.length > 1 ? 's' : '') + '</span>' +
      '<span class="pill">' + state.series + ' série' + (state.series > 1 ? 's' : '') + ' composée' + (state.series > 1 ? 's' : '') + '</span>';

    var c = state.config;
    $('server').innerHTML =
      '<div>Port <code>' + c.port + '</code> · provenance <code>' + esc(c.provenance) + '</code> · ' + c.rateLimitPerMinute + ' appels/min · mots dictés : <code>' + esc(c.vocabularyWrites) + '</code>' +
      (c.publicHosts.length ? ' · hosts publics : <code>' + esc(c.publicHosts.join(', ')) + '</code>' : '') + '</div>' +
      '<div class="sub" style="margin:8px 0 0">En ligne depuis ' + Math.round(state.uptimeSec / 60) + ' min. Cette page ne répond qu\'en local : à travers le tunnel, elle n\'existe pas (404).</div>';

    if (!state.drafts.length) { $('drafts').innerHTML = '<p class="empty">Aucun mot en attente. Dicte-en un à Claude : « LazyPO, ajoute le mot… ».</p>'; return; }
    $('drafts').innerHTML = state.drafts.map(function (d) {
      var f = function (k, label, full) {
        return '<div' + (full ? ' class="full"' : '') + '><label>' + label + '</label><input data-k="' + k + '" value="' + esc(d[k]) + '"></div>';
      };
      return '<form class="card" data-id="' + esc(d.id) + '">' +
        '<div class="grid">' + f('mot', 'Mot néerlandais (avec article)') + f('traduction', 'Traduction (variantes « / »)') +
        f('exemple', 'Phrase d\'exemple', true) + f('astuce', 'Astuce (pendant la question)') + f('infos', 'Infos (après la réponse)') + '</div>' +
        '<div class="row"><span class="when">dicté le ' + esc(fmt(d.createdAt)) + '</span>' +
        '<button type="button" data-act="reject">Jeter</button>' +
        '<button type="submit" class="primary"' + (s ? '' : ' disabled title="pas de session"') + '>Ajouter au vocabulaire</button></div>' +
        '<div class="msg"></div></form>';
    }).join('');
  }

  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
  }

  function refresh() {
    if (busy) return;
    fetch('/api/state').then(function (r) { return r.json(); }).then(render).catch(function () {
      $('status').innerHTML = '<span class="pill bad">serveur injoignable</span>';
    });
  }

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('form[data-id]'); if (!form) return;
    e.preventDefault();
    var body = {}; form.querySelectorAll('input[data-k]').forEach(function (i) { body[i.dataset.k] = i.value; });
    var msg = form.querySelector('.msg'); msg.textContent = 'Ajout…'; msg.className = 'msg'; busy = true;
    post('/api/drafts/' + form.dataset.id + '/accept', body).then(function () {
      msg.textContent = 'Ajouté au vocabulaire.'; msg.className = 'msg ok'; busy = false; setTimeout(refresh, 600);
    }).catch(function (err) { msg.textContent = 'Échec : ' + err.message; msg.className = 'msg bad'; busy = false; });
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act="reject"]'); if (!btn) return;
    var form = btn.closest('form[data-id]'); var msg = form.querySelector('.msg'); busy = true;
    post('/api/drafts/' + form.dataset.id + '/reject').then(function () { busy = false; refresh(); })
      .catch(function (err) { msg.textContent = 'Échec : ' + err.message; msg.className = 'msg bad'; busy = false; });
  });

  refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
